name: Build OmniROM 7.1.2 (j5xnlte)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "make target (bacon = flashable zip, bootimage = kernel only)"
        default: bacon
        required: true
      allow_old_ril:
        description: "build even if the J510FN stock RIL can't be fetched"
        default: "false"
        required: false
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TARGET: ${{ github.event.inputs.target || 'bacon' }}
    steps:
      - name: Free up disk space (merge / and /mnt)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 12288
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - uses: actions/checkout@v4
        with:
          path: port

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          df -h .

      - name: Sync OmniROM android-7.1 (shallow)
        run: |
          mkdir -p src && cd src
          repo init -u https://github.com/omnirom/android -b android-7.1 --depth=1 \
            -g default,-mips,-darwin,-notdefault --no-clone-bundle
          mkdir -p .repo/local_manifests
          cp ../port/local_manifests/*.xml .repo/local_manifests/
          repo sync -c -j16 --no-tags --no-clone-bundle --optimized-fetch --force-sync --fail-fast \
            || repo sync -c -j4 --no-tags --no-clone-bundle --force-sync
          df -h .

      - name: Use the J510FN stock RIL (matches the modem firmware)
        timeout-minutes: 40
        run: |
          sudo apt-get install -y -qq lz4 android-sdk-libsparse-utils >/dev/null
          cd src && bash ../port/scripts/stock-ril.sh | tee ../stock-ril.log
          grep -E ">> " ../stock-ril.log >> $GITHUB_STEP_SUMMARY || true
          # Fail fast while bringing this up: a build without the stock RIL has no SIM
          if [ "${{ github.event.inputs.allow_old_ril }}" != "true" ] && grep -q "keeping the J500" ../stock-ril.log; then
            echo "::error::stock RIL not applied (set allow_old_ril to build anyway)"; exit 1
          fi

      - name: Apply port patches
        run: cd src && PORT_DIR=$GITHUB_WORKSPACE/port bash ../port/scripts/patch-sources.sh

      - name: Bundle OmniROM wallpapers
        continue-on-error: true
        run: |
          which convert identify >/dev/null || sudo apt-get install -y -qq imagemagick
          cd src && bash ../port/scripts/add-omni-wallpapers.sh | tee ../wallpapers.log
          tail -2 ../wallpapers.log >> $GITHUB_STEP_SUMMARY

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build (Ubuntu 18.04 container, JDK 8 + Python 2)
        id: build
        run: |
          mkdir -p ccache tmp && chmod 1777 tmp
          # /tmp on the big build volume: OTA packaging unpacks the whole
          # target-files zip there, which overflows the small root disk
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -v "$GITHUB_WORKSPACE/tmp:/tmp" -w /w/src \
            -e TARGET="$TARGET" -e CCACHE_DIR=/w/ccache \
            ubuntu:18.04 bash /w/port/scripts/docker-build.sh

      - name: Check the zip before publishing
        if: success() && env.TARGET == 'bacon'
        run: |
          Z=$(ls src/out/target/product/j5xnlte/omni-*.zip | head -1)
          unzip -l "$Z" | grep -E "install/bin/run_scripts.sh|META-INF/com/google/android/updater-script|boot.img" 
          for f in install/bin/run_scripts.sh install/bin/functions.sh boot.img; do
            unzip -l "$Z" | grep -q " $f$" || { echo "::error::$f missing from $Z"; exit 1; }
          done
          unzip -p "$Z" META-INF/com/google/android/updater-script | head -20

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-${{ github.run_id }}

      - name: List all missing build dependencies
        if: failure()
        run: |
          cd src
          N=$(ls out/combined-*.ninja out/build-*.ninja 2>/dev/null | head -1)
          [ -n "$N" ] || exit 0
          sudo chmod -R a+rX out/*.ninja out/soong 2>/dev/null || true
          python3 ../port/scripts/missing-deps.py "$N" /w "$GITHUB_WORKSPACE" "$TARGET" > ../missing-deps.txt || true
          cd ..
          tail -1 missing-deps.txt
          { echo '## Missing build dependencies'; echo '```'; head -150 missing-deps.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Show error summary
        if: failure()
        run: |
          {
            echo '## Build failed — first errors'
            echo '```'
            grep -nE "error:|Error [0-9]|FAILED:|No rule to make target|\*\*\*" src/build.log | head -60 || true
            echo '```'
            echo '## Last 60 lines'
            echo '```'
            tail -60 src/build.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          grep -nE "error:|FAILED:|No rule to make target|\*\*\*" src/build.log | head -300 > error-excerpt.txt || true
          tail -400 src/build.log >> error-excerpt.txt || true

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: |
            error-excerpt.txt
            missing-deps.txt

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omni-7.1.2-j5xnlte-${{ github.run_number }}
          name: OmniROM 7.1.2 J510FN build ${{ github.run_number }}
          prerelease: true
          body: |
            Unofficial OmniROM 7.1.2 for Samsung Galaxy J5 2016 (SM-J510FN, j5xnlte).
            Flash the zip in TWRP after a full wipe (system, data, cache, dalvik).
            recovery.img is OmniROM's TWRP built from the same tree.
          files: |
            src/out/target/product/j5xnlte/omni-*.zip
            src/out/target/product/j5xnlte/boot.img
            src/out/target/product/j5xnlte/recovery.img
